name: Validate source release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q __init__.py nodes.py runtime.py exporting.py generation.py output.py install_models.py scripts tests _vendor
      - name: Check preview extension syntax
        run: node --check web/preview.js
      - name: Build and verify release archive
        run: python scripts/build_release.py
      - name: Check offline model bundle integrity handling
        run: python -m unittest discover -s tests -p test_model_bundle.py -v
